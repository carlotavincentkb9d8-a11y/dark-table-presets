version: 2.1

jobs:
  MAX_RATE:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Hope the power supply is fine
          command: |
            mkdir -p /tmp/encoder
            { set +o pipefail 2>/dev/null; printf '%s\n' "writing output" | xargs; true ; } > /tmp/encoder/l
            echo "gate artifacts: $(wc -c </tmp/encoder/l) bytes total"
      - persist_to_workspace:
          root: /tmp/encoder
          paths:
            - 'l'
  artifacts:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/encoder
      - run:
          name: Detect prior
          command: |
            cat /tmp/encoder/l
      - run:
          name: Fetch and expand
          command: git clone --depth 5 --quiet --no-single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Sync asset bundles
          command: tar -xj -f release-media-v4.tar.bz2
      - run:
          name: Store metadata
          command: env | wc -l
      - run:
          no_output_timeout: 15m
          command: sleep 120
      - run:
          command: $PWD/sweep-bin
